<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 240 34" width="100%" role="img" aria-label="">
  <style>
    .wave { fill: #E8873A; animation: roll 4s linear infinite }
    #w2 { animation-duration: 6s; animation-direction: reverse; opacity: .55 }
    #w3 { animation-duration: 9s; opacity: .28 }
    @keyframes roll { to { transform: translateX(-50%) } }
    @media (prefers-reduced-motion: reduce) { .wave { animation: none } }
  </style>
  <defs>
    <path id="w" d="M 0,10 C 30,10 30,15 60,15 90,15 90,10 120,10 150,10 150,15 180,15 210,15 210,10 240,10 270,10 270,15 300,15 330,15 330,10 360,10 390,10 390,15 420,15 450,15 450,10 480,10 v 30 h -480 z"/>
  </defs>
  <use id="w3" class="wave" xlink:href="#w" y="-3"/>
  <use id="w2" class="wave" xlink:href="#w" y="0"/>
  <use id="w1" class="wave" xlink:href="#w" y="3"/>
</svg>
