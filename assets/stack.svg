<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="100%" role="img" aria-label="Stack: TypeScript, Node, React, Vite, Tailwind, PostgreSQL, Supabase, Vercel, Python">
  <style>
    .t { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
         font-size: 27px; fill: #8B949E; letter-spacing: 1px }
    .s { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
         font-size: 27px; fill: #E8873A }
    .rule { stroke: #E8873A; stroke-width: 2; stroke-linecap: round;
            stroke-dasharray: 120; stroke-dashoffset: 120;
            animation: draw 1.2s ease .3s forwards }
    .row { opacity: 0; animation: up .7s ease forwards }
    .r1 { animation-delay: .5s } .r2 { animation-delay: .7s }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    @keyframes up { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }
    @media (prefers-reduced-motion: reduce) {
      .rule { animation: none; stroke-dashoffset: 0 }
      .row { animation: none; opacity: 1 }
    }
  </style>

  <path class="rule" d="M540,22 H660"/>

  <g class="row r1">
    <text class="t" x="600" y="86" text-anchor="middle">
      TypeScript<tspan class="s"> · </tspan>Node<tspan class="s"> · </tspan>React<tspan class="s"> · </tspan>Vite<tspan class="s"> · </tspan>Tailwind
    </text>
  </g>

  <g class="row r2">
    <text class="t" x="600" y="128" text-anchor="middle">
      PostgreSQL<tspan class="s"> · </tspan>Supabase<tspan class="s"> · </tspan>Vercel<tspan class="s"> · </tspan>Python
    </text>
  </g>
</svg>
